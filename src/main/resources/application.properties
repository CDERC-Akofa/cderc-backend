spring.application.name=cderc-backend

#spring.datasource.url=jdbc:postgresql://localhost:5432/cderc_db
#spring.datasource.url=${DATABASE_URL}

#spring.datasource.username=cderc_user
#spring.datasource.password=cderc_password
#spring.datasource.url=${SPRING_DATASOURCE_URL}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cderc_db}
spring.datasource.username=${DATABASE_USERNAME:cderc_user}
spring.datasource.password=${DATABASE_PASSWORD:cderc_password}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
server.address=0.0.0.0
# JWT Secret aus Environment Variable
# Railway Variable: JWT_SECRET=supersecretkey123
#jwt.secret=${JWT_SECRET}
jwt.secret=my-super-secret-key-for-cderc-application-2026-very-long
logging.level.org.springframework.security=DEBUG
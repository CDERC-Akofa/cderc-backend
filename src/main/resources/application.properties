spring.application.name=cderc-backend

#spring.datasource.url=jdbc:postgresql://localhost:5432/cderc_db
#spring.datasource.url=${DATABASE_URL}

#spring.datasource.username=cderc_user
#spring.datasource.password=cderc_password
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
server.address=0.0.0.0
# JWT Secret aus Environment Variable
# Railway Variable: JWT_SECRET=supersecretkey123
jwt.secret=${JWT_SECRET}
logging.level.org.springframework.security=DEBUG